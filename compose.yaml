services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: uvgo
      POSTGRES_USER: uvgo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - uvgo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uvgo -d uvgo"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  uvgo_pgdata:
