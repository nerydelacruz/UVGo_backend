plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.UVGgo'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	// SDK de Amazon Creators API (JARs locales)
	implementation files('libs/creatorsapi-java-sdk/dependencies/creatorsapi-java-sdk-1.3.0.jar')
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'
	implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
	implementation 'com.google.code.gson:gson:2.10.1'
	implementation 'io.gsonfire:gson-fire:1.9.0'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
	// Versión que define Spring Boot: springdoc necesita una más nueva que la 3.17 del SDK.
	implementation 'org.apache.commons:commons-lang3'
	// Azure Communication Services (correo). Se cambia Netty por el cliente HTTP del JDK
	// para no traer una versión de Netty distinta a la que administra Spring Boot.
	implementation('com.azure:azure-communication-email:1.1.5') {
		exclude group: 'com.azure', module: 'azure-core-http-netty'
	}
	// Azure Blob Storage (comprobantes de pago); misma versión de azure-core que el SDK de correo.
	implementation('com.azure:azure-storage-blob:12.35.1') {
		exclude group: 'com.azure', module: 'azure-core-http-netty'
	}
	implementation 'com.azure:azure-core-http-jdk-httpclient:1.1.7'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'postgres' }
}

tasks.register('postgresTest', Test) {
	description = 'Contrato API sobre una base PostgreSQL exclusiva configurada con TEST_DB_*'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'postgres' }
	doFirst {
		if (!System.getenv('TEST_DB_URL') || !System.getenv('TEST_DB_USER') || !System.getenv('TEST_DB_PASSWORD')) {
			throw new GradleException('Defina TEST_DB_URL, TEST_DB_USER y TEST_DB_PASSWORD para una base exclusiva de pruebas')
		}
	}
}
