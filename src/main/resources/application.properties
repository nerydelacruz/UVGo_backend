spring.application.name=backend

spring.profiles.active = dev
server.servlet.context-path =/uvgo/api

# Lee las claves locales desde .env (no se sube a git)
spring.config.import=optional:file:.env[.properties]

# La base compartida ya tiene aplicadas V4-V8 (catálogo de artículos, estados de kit y pedidos),
# pero esos archivos no están en este repositorio. Sin esto Flyway no deja arrancar.
spring.flyway.ignore-migration-patterns=*:missing

# SerpApi (Google Shopping)
serpapi.api-key=${API_KEY_SERPAPI:}
serpapi.hl=es
serpapi.gl=us

# BrightData (Scraper Studio)
brightdata.api-key=${API_KEY_BRIGHTDATA:}

# Rechaza campos desconocidos en las peticiones (p. ej. "rol" al registrarse).
spring.jackson.deserialization.fail-on-unknown-properties=true

# Seguridad: login con JWT (usuarios y solicitudes)
uvgo.security.jwt-secret=${JWT_SECRET}
uvgo.security.token-minutes=30
uvgo.security.institutional-domain=${INSTITUTIONAL_DOMAIN:uvg.edu.gt}
uvgo.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# Amazon Creators API
amazon.creators.credential-id=${AMAZON_CREDENTIAL_ID:}
amazon.creators.credential-secret=${AMAZON_CREDENTIAL_SECRET:}
amazon.creators.version=${AMAZON_CREDENTIAL_VERSION:}
amazon.creators.partner-tag=${AMAZON_PARTNER_TAG:}
amazon.creators.marketplace=www.amazon.com
