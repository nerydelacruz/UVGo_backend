spring.application.name=backend

spring.profiles.active = dev
server.servlet.context-path =/uvgo/api

# Recepción de documentos para la extracción de materiales (30/09).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Activar explícitamente en el servidor. Nunca incluir la clave en el frontend.
uvgo.ia.enabled=${UVGO_IA_ENABLED:false}
uvgo.ia.api-key=${ANTHROPIC_API_KEY:}
uvgo.ia.model=${ANTHROPIC_MODEL:claude-haiku-4-5}
