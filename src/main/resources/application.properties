spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uvgo}
spring.datasource.username=${DB_USER:uvgo}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
uvgo.security.jwt-secret=${JWT_SECRET}
uvgo.security.token-minutes=30
uvgo.security.institutional-domain=${INSTITUTIONAL_DOMAIN:uvg.edu.gt}
uvgo.cors.origins=${CORS_ORIGINS:http://localhost:5173}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
